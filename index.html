<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quét Mã QR Nề Nếp Học Sinh</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Thư viện Quét QR Camera (html5-qrcode) -->
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-slate-100 p-4 md:p-8">

  <main class="max-w-4xl mx-auto bg-white rounded-xl p-4 md:p-6 shadow-sm border border-gray-100 min-h-[460px]">
    
    <!-- TAB 0: QUÉT MÃ QR (HIỂN THỊ CẢ THÔNG TIN LỚP) -->
    <section id="content-tab-0" class="tab-content space-y-4">
      <h2 class="text-lg font-bold text-blue-700 uppercase flex items-center gap-2">
        <i class="fa-solid fa-qrcode"></i> 0. Quét Mã QR Nề Nếp Học Sinh (Đồng Bộ Offline)
      </h2>
      
      <!-- HÌNH THỨC GHI NHẬN -->
      <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
        <label class="block font-bold text-gray-700 mb-2">Chọn hình thức ghi nhận khi quét QR:</label>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
          <label class="flex items-center gap-2 bg-white p-3 rounded-lg border cursor-pointer hover:border-blue-500">
            <input type="radio" name="qr-action" value="muon_co_phep" class="w-4 h-4 text-blue-600">
            <span class="text-sm font-semibold text-amber-600">Đi học muộn (Có phép)</span>
          </label>
          <label class="flex items-center gap-2 bg-white p-3 rounded-lg border cursor-pointer hover:border-blue-500">
            <input type="radio" name="qr-action" value="muon_khong_phep" checked class="w-4 h-4 text-blue-600">
            <span class="text-sm font-semibold text-red-600">Đi học muộn (Không phép)</span>
          </label>
          <label class="flex items-center gap-2 bg-white p-3 rounded-lg border cursor-pointer hover:border-blue-500">
            <input type="radio" name="qr-action" value="diem_thuong" class="w-4 h-4 text-blue-600">
            <span class="text-sm font-semibold text-green-600">Khen thưởng (+ Điểm)</span>
          </label>
          <label class="flex items-center gap-2 bg-white p-3 rounded-lg border cursor-pointer hover:border-blue-500">
            <input type="radio" name="qr-action" value="diem_tru" class="w-4 h-4 text-blue-600">
            <span class="text-sm font-semibold text-red-700">Vi phạm (- Điểm)</span>
          </label>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- CỘT 1: QUÉT CAMERA -->
        <div class="flex flex-col items-center space-y-3">
          <div id="reader" class="w-full max-w-sm bg-black rounded-xl overflow-hidden min-h-[260px] flex items-center justify-center text-white text-xs">
            <span>Camera chưa bật</span>
          </div>
          <div class="flex gap-2">
            <button onclick="startQRScanner()" class="bg-blue-600 text-white text-sm px-4 py-2 rounded-lg font-semibold hover:bg-blue-700 flex items-center gap-1">
              <i class="fa-solid fa-camera"></i> Bật Camera Quét
            </button>
            <button onclick="stopQRScanner()" class="bg-gray-500 text-white text-sm px-4 py-2 rounded-lg font-semibold hover:bg-gray-600">
              Tắt Camera
            </button>
          </div>
        </div>

        <!-- CỘT 2: NHẬP TAY, THÔNG TIN VỪA QUÉT VÀ LỊCH SỬ -->
        <div class="space-y-4">
          <!-- Ô NHẬP TAY THỦ CÔNG -->
          <div class="bg-gray-50 p-3 rounded-xl border border-gray-200">
            <label class="block text-xs font-bold text-gray-600 mb-1">HOẶC NHẬP MÃ / CHUỖI QR TẠI ĐÂY:</label>
            <div class="flex gap-2">
              <input type="text" id="manual-ma-hs" placeholder="Dán nội dung QR hoặc Mã HS..." class="flex-1 border p-2 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              <button onclick="processManualQR()" class="bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-bold hover:bg-emerald-700">
                Xác nhận
              </button>
            </div>
          </div>

          <!-- KHUNG HIỂN THỊ THÔNG TIN HỌC SINH VỪA QUÉT (CÓ LỚP) -->
          <div id="student-info-card" class="hidden bg-blue-50 border border-blue-200 rounded-xl p-3.5 space-y-2 transition-all">
            <div class="flex justify-between items-start">
              <div>
                <span class="text-[10px] font-bold uppercase tracking-wider text-blue-600">Học sinh vừa quét</span>
                <h4 id="info-student-name" class="text-base font-bold text-gray-800">---</h4>
              </div>
              <span id="info-action-tag" class="text-xs font-bold px-2.5 py-1 rounded-full bg-red-100 text-red-700">---</span>
            </div>
            <div class="flex flex-wrap items-center gap-3 text-xs text-gray-600 border-t border-blue-100 pt-2">
              <p>Mã HS: <strong id="info-student-id" class="text-gray-900">---</strong></p>
              <p>Lớp: <strong id="info-student-class" class="text-blue-700 bg-blue-100 px-2 py-0.5 rounded font-bold">---</strong></p>
              <p>Giờ: <span id="info-scan-time" class="text-gray-500">--:--</span></p>
            </div>
          </div>

          <!-- LỊCH SỬ QUÉT -->
          <div class="space-y-2">
            <div class="flex justify-between items-center">
              <h3 class="font-bold text-sm text-gray-700">Lịch Sử Quét & Trạng Thái Đồng Bộ:</h3>
              <button onclick="triggerManualSync()" id="btn-sync-now" class="bg-amber-500 text-white text-xs px-3 py-1.5 rounded-lg font-bold hover:bg-amber-600 flex items-center gap-1 shadow-sm">
                <i class="fa-solid fa-rotate"></i> Gửi Đồng Bộ Lại (<span id="pending-count-badge">0</span>)
              </button>
            </div>

            <div id="qr-log-list" class="space-y-2 max-h-[220px] overflow-y-auto border p-2 rounded-xl bg-slate-50">
              <p class="text-sm text-gray-400 italic text-center p-2">Chưa có lượt quét nào trong phiên...</p>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- SCRIPT LOGIC XỬ LÝ -->
  <script>
    // 1. DỮ LIỆU MẪU DÙNG CHO TÌM KIẾM THEO MÃ HS (Bạn có thể sửa danh sách này)
    const danhSachHocSinh = [
      { maHS: "HS001", hoTen: "Nguyễn Văn An", lop: "10A1" },
      { maHS: "HS002", hoTen: "Trần Thị Bích", lop: "10A2" },
      { maHS: "HS003", hoTen: "Lê Văn Cường", lop: "11B1" },
      { maHS: "HS004", hoTen: "Phạm Minh Dung", lop: "12C3" }
    ];

    let html5QrCodeScanner = null;
    let pendingLogs = 0;

    // 2. XỬ LÝ CHUỖI QR / MÃ HS KHI QUÉT HOẶC NHẬP TAY
    function handleQRCode(qrData) {
      if (!qrData) return;

      let student = null;

      // TH1: Chuỗi QR là JSON (Vd mã chứa thông tin: {"maHS":"HS001", "hoTen":"Nguyễn Văn A", "lop":"10A1"})
      try {
        const parsed = JSON.parse(qrData);
        if (parsed.maHS || parsed.id) {
          student = {
            maHS: parsed.maHS || parsed.id,
            hoTen: parsed.hoTen || parsed.name || "Chưa rõ tên",
            lop: parsed.lop || parsed.class || "Chưa rõ lớp"
          };
        }
      } catch (e) {
        // TH2: Mã QR chỉ chứa Mã HS (Vd: "HS001"), tra cứu trong mảng danhSachHocSinh
        const cleanCode = qrData.trim().toUpperCase();
        const found = danhSachHocSinh.find(s => s.maHS.toUpperCase() === cleanCode);
        
        if (found) {
          student = found;
        } else {
          student = {
            maHS: cleanCode,
            hoTen: "Học sinh mới / Chưa cập nhật",
            lop: "Chưa phân lớp"
          };
        }
      }

      // Lấy hình thức vi phạm / khen thưởng đang chọn
      const actionEl = document.querySelector('input[name="qr-action"]:checked');
      const actionText = actionEl ? actionEl.nextElementSibling.innerText : 'Chưa rõ';
      const timeStr = new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

      // Cập nhật thông tin lên Thẻ Card Học sinh
      document.getElementById('info-student-name').innerText = student.hoTen;
      document.getElementById('info-student-id').innerText = student.maHS;
      document.getElementById('info-student-class').innerText = student.lop; // <--- Cập nhật thông tin Lớp
      document.getElementById('info-action-tag').innerText = actionText;
      document.getElementById('info-scan-time').innerText = timeStr;
      document.getElementById('student-info-card').classList.remove('hidden');

      // Thêm thông tin vào Lịch sử quét
      addLogEntry({ ...student, actionText, timeStr });
    }

    // 3. THÊM DÒNG VÀO LỊCH SỬ QUÉT
    function addLogEntry(data) {
      const logList = document.getElementById('qr-log-list');
      
      // Xóa thông báo rỗng
      if (logList.querySelector('p.italic')) {
        logList.innerHTML = '';
      }

      const itemHtml = `
        <div class="bg-white p-2.5 rounded-lg border border-gray-200 flex justify-between items-center text-xs shadow-sm">
          <div>
            <div class="font-bold text-gray-800">
              ${data.hoTen} 
              <span class="text-blue-700 bg-blue-50 px-1.5 py-0.5 rounded border border-blue-200 font-semibold ml-1">Lớp ${data.lop}</span>
            </div>
            <div class="text-gray-500 mt-0.5">Mã: ${data.maHS} • <span class="text-amber-700 font-medium">${data.actionText}</span></div>
          </div>
          <div class="text-right">
            <span class="text-gray-400 font-mono block">${data.timeStr}</span>
            <span class="inline-block w-2 h-2 rounded-full bg-emerald-500" title="Đã ghi nhận"></span>
          </div>
        </div>
      `;

      logList.insertAdjacentHTML('afterbegin', itemHtml);

      // Cập nhật đếm số lượng offline pending
      pendingLogs++;
      document.getElementById('pending-count-badge').innerText = pendingLogs;
    }

    // 4. XỬ LÝ KHI BẤM NÚT XÁC NHẬN NHẬP TAY
    function processManualQR() {
      const inputEl = document.getElementById('manual-ma-hs');
      const val = inputEl.value.trim();
      if (!val) {
        alert("Vui lòng nhập Mã học sinh hoặc dán nội dung QR!");
        return;
      }
      handleQRCode(val);
      inputEl.value = '';
    }

    // 5. BẬT CAMERA QUÉT TỨC THỜI
    function startQRScanner() {
      if (!html5QrCodeScanner) {
        html5QrCodeScanner = new Html5Qrcode("reader");
      }

      const config = { fps: 10, qrbox: { width: 220, height: 220 } };

      html5QrCodeScanner.start(
        { facingMode: "environment" }, 
        config, 
        (decodedText) => {
          handleQRCode(decodedText);
          // Tạm dừng 1 giây để tránh quét lặp liên tục cùng 1 mã
          html5QrCodeScanner.pause();
          setTimeout(() => { html5QrCodeScanner.resume(); }, 1500);
        },
        (errorMessage) => {
          // Bỏ qua lỗi quét liên tục không tìm thấy mã
        }
      ).catch(err => {
        alert("Không thể bật Camera! Kiểm tra quyền truy cập Camera của trình duyệt.");
        console.error(err);
      });
    }

    // 6. TẮT CAMERA
    function stopQRScanner() {
      if (html5QrCodeScanner) {
        html5QrCodeScanner.stop().then(() => {
          document.getElementById('reader').innerHTML = '<span class="text-white text-xs">Camera đã tắt</span>';
        }).catch(err => console.error(err));
      }
    }

    // 7. GIẢ LẬP ĐỒNG BỘ DATA
    function triggerManualSync() {
      if (pendingLogs === 0) {
        alert("Hiện không có bản ghi nào chờ đồng bộ.");
        return;
      }
      alert(`Đã đồng bộ thành công ${pendingLogs} bản ghi lên hệ thống!`);
      pendingLogs = 0;
      document.getElementById('pending-count-badge').innerText = "0";
    }
  </script>
</body>
</html>
