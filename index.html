<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ Thống Quét Mã QR & Điểm Danh v4.5</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #fff; margin: 0; padding: 15px; }
    .container { max-width: 480px; margin: 0 auto; text-align: center; }
    .card { background: #1e1e1e; padding: 25px; border-radius: 12px; border: 1px solid #333; margin-top: 15px; }
    input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; border: 1px solid #444; background: #222; color: #fff; }
    button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; background: #1a73e8; color: white; }
    button.alt { background: #333; border: 1px solid #555; }
    #reader { width: 100%; background: #000; border-radius: 12px; overflow: hidden; margin-top: 15px; }
    
    .status-badge { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; margin-bottom: 8px; }
    .online { background: #2e7d32; color: #fff; }
    .offline { background: #c62828; color: #fff; }

    /* MÀN HÌNH POPUP HIỂN THỊ THÔNG TIN NGƯỜI ĐƯỢC QUÉT */
    #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 9999; justify-content: center; align-items: center; }
    .popup-card { background: #fff; color: #333; padding: 25px; border-radius: 16px; width: 85%; max-width: 380px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .popup-card.success { border-top: 8px solid #4caf50; }
    .popup-card.overwrite { border-top: 8px solid #ff9800; }
    .popup-card.error { border-top: 8px solid #f44336; }
    
    /* THANH THỜI GIAN ĐẾM NGHƯỢC 4 GIÂY */
    .timer-bar { height: 6px; background: #1a73e8; width: 100%; margin-top: 15px; border-radius: 3px; animation: shrink 4s linear forwards; }
    @keyframes shrink { from { width: 100%; } to { width: 0%; } }
  </style>
</head>
<body>

<div class="container">
  <!-- MÀN HÌNH ĐĂNG NHẬP -->
  <div id="loginView" class="card">
    <h2 style="color: #4caf50;">ĐĂNG NHẬP HỆ THỐNG</h2>
    <input type="text" id="username" placeholder="Số định danh / Mã cán bộ">
    <input type="password" id="password" placeholder="Mật khẩu">
    <button onclick="handleLogin()">ĐĂNG NHẬP</button>
    <button onclick="clearAppStorage()" class="alt" style="margin-top: 15px; font-size: 11px; color: #ffb74d;">🧹 Xóa bộ nhớ đệm kẹt (Clear Cache)</button>
    <div id="loginError" style="color: #f44336; margin-top: 10px; font-size: 14px;"></div>
  </div>

  <!-- MÀN HÌNH QUÉT QR -->
  <div id="mainView" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
      <span id="networkStatus" class="status-badge online">🌐 Trực tuyến</span>
      <span id="pendingCount" style="font-size: 12px; color: #ffca28;"></span>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <span id="userInfo" style="font-weight: bold; color: #64b5f6;"></span>
      <div>
        <button onclick="clearPendingQueue()" class="alt" style="width: auto; padding: 6px 8px; font-size: 11px; background: #e65100; color: #fff;">Xóa hàng chờ</button>
        <button onclick="handleLogout()" class="alt" style="width: auto; padding: 6px 10px; font-size: 11px; background: #c62828;">Đăng xuất</button>
      </div>
    </div>
    <div id="reader"></div>
  </div>
</div>

<!-- POPUP THÔNG BÁO HIỂN THỊ TRONG 4 GIÂY -->
<div id="overlay">
  <div id="popupCard" class="popup-card">
    <div id="statusIcon" style="font-size: 48px;">✅</div>
    <div id="statusTitle" style="font-weight: bold; font-size: 13px; color: #666; text-transform: uppercase;"></div>
    <div id="studentName" style="font-size: 22px; font-weight: bold; color: #1a73e8; margin: 8px 0;"></div>
    <div id="studentClass" style="font-weight: bold; color: #d93025; font-size: 16px;"></div>
    <div id="studentId" style="color: #555; font-size: 14px; margin-top: 2px;"></div>
    <div id="checkTime" style="font-size: 13px; color: #777; margin-top: 8px;"></div>
    <div id="scannerInfo" style="font-size: 12px; color: #388e3c; margin-top: 4px;"></div>
    <div id="timerBar" class="timer-bar"></div>
  </div>
</div>

<script>
  // 🔴 THAY BẰNG URL WEB APP CỦA BẠN NẾU CÓ THAY ĐỔI
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzWMKryy4yh1W2mbHJ_te7o1kBsv6tHZ7Pneom0foak9JwZ6n_fGKqgtsdwSe5aBIlTwQ/exec";

  let currentUser = null;
  let html5QrcodeScanner = null;
  let isProcessing = false;
  let isSyncing = false;
  let popupTimeout = null;

  window.onload = function() {
    updateNetworkStatus();
    window.addEventListener('online', updateNetworkStatus);
    window.addEventListener('offline', updateNetworkStatus);

    const savedUser = localStorage.getItem("user");
    if (savedUser) {
      currentUser = JSON.parse(savedUser);
      showMainView();
    }
  };

  function clearAppStorage() {
    localStorage.clear();
    alert("Đã xóa bộ nhớ đệm thành công!");
    location.reload(true);
  }

  function clearPendingQueue() {
    localStorage.removeItem("offline_queue");
    updatePendingUI();
  }

  function updateNetworkStatus() {
    const badge = document.getElementById('networkStatus');
    if (!badge) return;
    if (navigator.onLine) {
      badge.className = "status-badge online";
      badge.innerText = "🌐 Trực tuyến";
      syncOfflineData();
    } else {
      badge.className = "status-badge offline";
      badge.innerText = "📡 Ngoại tuyến (Offline)";
    }
    updatePendingUI();
  }

  function getOfflineQueue() {
    return JSON.parse(localStorage.getItem("offline_queue") || "[]");
  }

  function saveOfflineQueue(queue) {
    localStorage.setItem("offline_queue", JSON.stringify(queue));
    updatePendingUI();
  }

  function updatePendingUI() {
    const countEl = document.getElementById("pendingCount");
    if (!countEl) return;
    const q = getOfflineQueue();
    countEl.innerText = q.length > 0 ? `⏳ Chờ đồng bộ: ${q.length}` : "";
  }

  function callAPI(params, callbackName) {
    const oldScript = document.getElementById('jsonp_script');
    if (oldScript) oldScript.remove();

    let url = SCRIPT_URL + "?callback=" + callbackName + "&_nc=" + Date.now();
    for (let key in params) {
      url += "&" + key + "=" + encodeURIComponent(params[key]);
    }

    const script = document.createElement('script');
    script.id = 'jsonp_script';
    script.src = url;
    document.body.appendChild(script);
  }

  function handleLogin() {
    const u = document.getElementById("username").value.trim();
    const p = document.getElementById("password").value.trim();
    if (!u || !p) return alert("Vui lòng nhập đầy đủ Số định danh và Mật khẩu!");

    document.getElementById("loginError").innerText = "Đang xác thực...";
    window.onLoginResp = function(data) {
      if (data.success) {
        currentUser = data.user;
        localStorage.setItem("user", JSON.stringify(currentUser));
        document.getElementById("loginError").innerText = "";
        showMainView();
      } else {
        document.getElementById("loginError").innerText = data.message;
      }
    };
    callAPI({ action: "login", username: u, password: p }, "onLoginResp");
  }

  function showMainView() {
    document.getElementById("loginView").style.display = "none";
    document.getElementById("mainView").style.display = "block";
    document.getElementById("userInfo").innerText = `${currentUser.name} (${currentUser.role})`;
    updatePendingUI();

    if (!html5QrcodeScanner) {
      html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 15, qrbox: { width: 250, height: 250 } });
      html5QrcodeScanner.render(onScanSuccess);
    }

    syncOfflineData();
  }

  function onScanSuccess(decodedText) {
    if (isProcessing) return;
    isProcessing = true;
    playBeep();

    const nowTimestamp = Date.now();
    saveScanOffline(decodedText, nowTimestamp);
    syncOfflineData();

    // Tắt khóa quét mã tiếp theo sau khi Popup đóng (4 giây)
    setTimeout(() => {
      isProcessing = false;
    }, 4000);
  }

  function saveScanOffline(decodedText, timestamp) {
    const queue = getOfflineQueue();
    queue.push({
      qrContent: decodedText,
      scannerId: currentUser.id,
      scannerName: currentUser.name,
      timestamp: timestamp
    });
    saveOfflineQueue(queue);
  }

  function syncOfflineData() {
    if (isSyncing || !navigator.onLine) return;
    const queue = getOfflineQueue();
    if (queue.length === 0) return;

    isSyncing = true;
    const item = queue[0];

    window.onSyncItemResp = function(res) {
      const currentQ = getOfflineQueue();
      if (currentQ.length > 0) {
        currentQ.shift(); // Xóa mục đã đồng bộ thành công khỏi hàng chờ
        saveOfflineQueue(currentQ);
      }
      isSyncing = false;

      // HIỂN THỊ POPUP THÔNG BÁO CHO NGƯỜI QUÉT TRONG 4S
      handleResult(res);

      if (getOfflineQueue().length > 0) {
        setTimeout(syncOfflineData, 200);
      }
    };

    callAPI({
      action: "checkIn",
      qrContent: item.qrContent,
      scannerId: item.scannerId,
      scannerName: item.scannerName,
      timestamp: item.timestamp
    }, "onSyncItemResp");
  }

  // HÀM BẬT POPUP THÔNG BÁO HIỂN THỊ TRONG DÚNG 4 GIÂY
  function handleResult(res) {
    const overlay = document.getElementById('overlay');
    const card = document.getElementById('popupCard');
    const timerBar = document.getElementById('timerBar');

    if (popupTimeout) clearTimeout(popupTimeout);

    // Reset lại hiệu ứng thanh thời gian 4s
    timerBar.style.animation = 'none';
    timerBar.offsetHeight; 
    timerBar.style.animation = 'shrink 4s linear forwards';

    if (res && res.success) {
      document.getElementById('studentName').innerText = res.student.name;
      document.getElementById('studentClass').innerText = "Lớp: " + res.student.className;
      document.getElementById('studentId').innerText = "Mã số: " + res.student.id;
      document.getElementById('scannerInfo').innerText = "Người quét: " + res.scanner;

      if (res.overwritten) {
        card.className = "popup-card overwrite";
        document.getElementById('statusIcon').innerText = "🔄";
        document.getElementById('statusTitle').innerText = "ĐÃ CẬP NHẬT TỪ VẮNG SANG ĐI HỌC MUỘN";
      } else {
        card.className = "popup-card success";
        document.getElementById('statusIcon').innerText = "✅";
        document.getElementById('statusTitle').innerText = "ĐIỂM DANH THÀNH CÔNG";
      }
      document.getElementById('checkTime').innerText = "Thời gian: " + res.time;
    } else {
      card.className = "popup-card error";
      document.getElementById('statusIcon').innerText = "❌";
      document.getElementById('statusTitle').innerText = "LỖI ĐIỂM DANH";
      document.getElementById('studentName').innerText = res ? res.message : "Đã cập nhật dữ liệu!";
      document.getElementById('studentClass').innerText = "";
      document.getElementById('studentId').innerText = "";
      document.getElementById('checkTime').innerText = "";
      document.getElementById('scannerInfo').innerText = "";
    }

    // Hiển thị Popup
    overlay.style.display = 'flex';

    // Tự động đóng Popup sau đúng 4000ms (4 giây)
    popupTimeout = setTimeout(() => {
      overlay.style.display = 'none';
    }, 4000);
  }

  function handleLogout() {
    localStorage.removeItem("user");
    currentUser = null;
    location.reload();
  }

  function playBeep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, ctx.currentTime);
      osc.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.12);
    } catch(e) {}
  }
</script>
</body>
</html>
