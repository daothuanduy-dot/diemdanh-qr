<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ Thống Quét Mã QR & Điểm Danh v5.2</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #fff; margin: 0; padding: 15px; }
    .container { max-width: 480px; margin: 0 auto; text-align: center; }
    .card { background: #1e1e1e; padding: 25px; border-radius: 12px; border: 1px solid #333; margin-top: 15px; }
    input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; border: 1px solid #444; background: #222; color: #fff; }
    button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; background: #1a73e8; color: white; }
    button.alt { background: #333; border: 1px solid #555; }
    #reader { width: 100%; background: #000; border-radius: 12px; overflow: hidden; margin-top: 15px; }
    
    .status-badge { display: inline-block; padding: 6px 12px; border-radius: 16px; font-size: 12px; font-weight: bold; }
    .online { background: #2e7d32; color: #fff; }
    .offline { background: #c62828; color: #fff; }
    .clickable-pending { background: #e65100; color: #fff; cursor: pointer; animation: pulse 2s infinite; }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.7; }
      100% { opacity: 1; }
    }

    /* OVERLAY POPUP THÔNG BÁO QUÉT 4S */
    #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 9999; justify-content: center; align-items: center; }
    .popup-card { background: #fff; color: #333; padding: 25px; border-radius: 16px; width: 85%; max-width: 380px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .popup-card.success { border-top: 8px solid #4caf50; }
    .timer-bar { height: 6px; background: #1a73e8; width: 100%; margin-top: 15px; border-radius: 3px; animation: shrink 4s linear forwards; }
    @keyframes shrink { from { width: 100%; } to { width: 0%; } }

    /* MODAL DANH SÁCH CHỜ ĐỒNG BỘ */
    #queueModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 9998; justify-content: center; align-items: center; }
    .modal-card { background: #1e1e1e; color: #fff; padding: 20px; border-radius: 16px; width: 90%; max-width: 420px; max-height: 80vh; display: flex; flex-direction: column; text-align: left; }
    .modal-body { overflow-y: auto; margin: 15px 0; flex: 1; }
    .queue-item { background: #2a2a2a; padding: 10px 12px; border-radius: 8px; margin-bottom: 8px; border-left: 4px solid #ff9800; font-size: 13px; }
  </style>
</head>
<body>

<div class="container">
  <!-- MÀN HÌNH ĐĂNG NHẬP -->
  <div id="loginView" class="card">
    <h2 style="color: #4caf50;">ĐĂNG NHẬP HỆ THỐNG</h2>
    <input type="text" id="username" placeholder="Số định danh / Mã cán bộ">
    <input type="password" id="password" placeholder="Mật khẩu">
    <button id="loginBtn" onclick="handleLogin()">ĐĂNG NHẬP</button>
    <div id="loginError" style="color: #ff9800; margin-top: 12px; font-size: 14px; font-weight: bold;"></div>
  </div>

  <!-- MÀN HÌNH QUÉT QR -->
  <div id="mainView" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
      <span id="networkStatus" class="status-badge online">🌐 Trực tuyến</span>
      <span id="pendingBtn" class="status-badge clickable-pending" style="display: none;" onclick="openQueueModal()">⏳ Chờ đồng bộ: <b id="pendingCount">0</b></span>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <span id="userInfo" style="font-weight: bold; color: #64b5f6;"></span>
      <button onclick="handleLogout()" class="alt" style="width: auto; padding: 6px 12px; font-size: 12px; background: #c62828;">Đăng xuất</button>
    </div>
    <div id="reader"></div>
  </div>
</div>

<!-- POPUP THÔNG BÁO QUÉT THÀNH CÔNG (HIỂN THỊ 4 GIÂY) -->
<div id="overlay">
  <div id="popupCard" class="popup-card success">
    <div style="font-size: 48px;">✅</div>
    <div style="font-weight: bold; font-size: 13px; color: #388e3c; text-transform: uppercase;">QUÉT MÃ THÀNH CÔNG</div>
    <div id="studentName" style="font-size: 22px; font-weight: bold; color: #1a73e8; margin: 8px 0;"></div>
    <div id="studentId" style="color: #555; font-size: 15px; font-weight: bold;"></div>
    <div id="checkTime" style="font-size: 13px; color: #777; margin-top: 8px;"></div>
    <div id="scannerInfo" style="font-size: 12px; color: #1976d2; margin-top: 4px;"></div>
    <div id="timerBar" class="timer-bar"></div>
  </div>
</div>

<!-- MODAL XEM DANH SÁCH HỌC SINH CHỜ ĐỒNG BỘ -->
<div id="queueModal">
  <div class="modal-card">
    <h3 style="margin: 0; color: #ffca28;">📋 Danh Sách Chờ Đồng Bộ</h3>
    <p style="font-size: 12px; color: #aaa; margin: 5px 0 10px 0;">Dữ liệu đã lưu an toàn trên máy. Nhấn thử gửi lại nếu mạng chập chờn.</p>
    
    <div id="queueList" class="modal-body"></div>

    <div style="display: flex; gap: 10px;">
      <button onclick="forceSyncQueue()" style="background: #2e7d32; flex: 1;">🔄 Thử gửi lại ngay</button>
      <button onclick="closeQueueModal()" class="alt" style="flex: 1;">Đóng</button>
    </div>
  </div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzUtD3ofocOUbLebcB7vlFkmM2AZedjlWKGkB9xhRb5xSnDjqttigOqbX_lFvSMtpJsZg/exec";

  let currentUser = null;
  let html5QrcodeScanner = null;
  let isProcessing = false;
  let isSyncing = false;
  let popupTimeout = null;

  window.onload = function() {
    updateNetworkStatus();
    window.addEventListener('online', updateNetworkStatus);
    window.addEventListener('offline', updateNetworkStatus);

    const savedUser = localStorage.getItem("user");
    if (savedUser) {
      currentUser = JSON.parse(savedUser);
      showMainView();
    }
  };

  // HÀM CALLBACK ĐĂNG NHẬP TOÀN CỤC (GLOBAL CALLBACK)
  window.onLoginResp = function(data) {
    const btn = document.getElementById("loginBtn");
    const errEl = document.getElementById("loginError");
    btn.disabled = false;

    if (data && data.success) {
      currentUser = data.user;
      localStorage.setItem("user", JSON.stringify(currentUser));
      errEl.innerText = "";
      showMainView();
    } else {
      errEl.innerText = data ? data.message : "Mật khẩu hoặc tài khoản không đúng!";
    }
  };

  function handleLogin() {
    const u = document.getElementById("username").value.trim();
    const p = document.getElementById("password").value.trim();
    const btn = document.getElementById("loginBtn");
    const errEl = document.getElementById("loginError");

    if (!u || !p) {
      alert("Vui lòng nhập đầy đủ Số định danh và Mật khẩu!");
      return;
    }

    btn.disabled = true;
    errEl.style.color = "#ff9800";
    errEl.innerText = "⏳ Đang xác thực dữ liệu...";

    // TIMEOUT 6 GIÂY NẾU KHÔNG CÓ PHẢN HỒI
    const loginTimeout = setTimeout(() => {
      btn.disabled = false;
      errEl.style.color = "#f44336";
      errEl.innerText = "❌ Lỗi kết nối máy chủ! Vui lòng kiểm tra lại mạng.";
    }, 6000);

    // Ghi đè callback để clear timeout khi có dữ liệu
    const originalCallback = window.onLoginResp;
    window.onLoginResp = function(data) {
      clearTimeout(loginTimeout);
      originalCallback(data);
    };

    callAPI({ action: "login", username: u, password: p }, "onLoginResp");
  }

  function callAPI(params, callbackName) {
    const oldScript = document.getElementById('jsonp_script');
    if (oldScript) oldScript.remove();

    let url = SCRIPT_URL + "?callback=" + callbackName + "&_nc=" + Date.now();
    for (let key in params) {
      url += "&" + key + "=" + encodeURIComponent(params[key]);
    }

    const script = document.createElement('script');
    script.id = 'jsonp_script';
    script.src = url;
    document.body.appendChild(script);
  }

  function updateNetworkStatus() {
    const badge = document.getElementById('networkStatus');
    if (!badge) return;
    if (navigator.onLine) {
      badge.className = "status-badge online";
      badge.innerText = "🌐 Trực tuyến";
      syncOfflineData();
    } else {
      badge.className = "status-badge offline";
      badge.innerText = "📡 Ngoại tuyến (Offline)";
    }
    updatePendingUI();
  }

  function getOfflineQueue() {
    return JSON.parse(localStorage.getItem("offline_queue") || "[]");
  }

  function saveOfflineQueue(queue) {
    localStorage.setItem("offline_queue", JSON.stringify(queue));
    updatePendingUI();
  }

  function updatePendingUI() {
    const btn = document.getElementById("pendingBtn");
    const countEl = document.getElementById("pendingCount");
    const q = getOfflineQueue();

    if (q.length > 0) {
      countEl.innerText = q.length;
      btn.style.display = "inline-block";
    } else {
      btn.style.display = "none";
    }
  }

  function showMainView() {
    document.getElementById("loginView").style.display = "none";
    document.getElementById("mainView").style.display = "block";
    document.getElementById("userInfo").innerText = `${currentUser.name} (${currentUser.role})`;
    updatePendingUI();

    if (!html5QrcodeScanner) {
      html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 15, qrbox: { width: 250, height: 250 } });
      html5QrcodeScanner.render(onScanSuccess);
    }

    syncOfflineData();
  }

  function parseStudentCode(qrContent) {
    let code = qrContent ? qrContent.toString().trim() : "";
    if (code.indexOf("Mã HS:") !== -1) {
      let match = code.match(/Mã HS:\s*(\d+)/i);
      if (match && match[1]) return match[1].trim();
    }
    if (code.indexOf("|") !== -1) {
      return code.split("|")[0].replace("Mã HS:", "").trim();
    }
    return code;
  }

  function onScanSuccess(decodedText) {
    if (isProcessing) return;
    isProcessing = true;
    playBeep();

    const nowTimestamp = Date.now();
    const studentCode = parseStudentCode(decodedText);
    const dateFormatted = new Date(nowTimestamp).toLocaleTimeString('vi-VN');

    showSuccessPopup(studentCode, dateFormatted);
    saveScanOffline(decodedText, nowTimestamp);
    syncOfflineData();

    setTimeout(() => {
      isProcessing = false;
    }, 2500);
  }

  function showSuccessPopup(studentCode, timeStr) {
    const overlay = document.getElementById('overlay');
    const timerBar = document.getElementById('timerBar');

    document.getElementById('studentName').innerText = "Học sinh ID: " + studentCode;
    document.getElementById('studentId').innerText = "Đã nhận diện mã QR thành công";
    document.getElementById('checkTime').innerText = "Thời gian quét: " + timeStr;
    document.getElementById('scannerInfo').innerText = "Người thực hiện: " + currentUser.name;

    if (popupTimeout) clearTimeout(popupTimeout);

    timerBar.style.animation = 'none';
    timerBar.offsetHeight; 
    timerBar.style.animation = 'shrink 4s linear forwards';

    overlay.style.display = 'flex';

    popupTimeout = setTimeout(() => {
      overlay.style.display = 'none';
    }, 4000);
  }

  function saveScanOffline(decodedText, timestamp) {
    const queue = getOfflineQueue();
    queue.push({
      qrContent: decodedText,
      scannerId: currentUser.id,
      scannerName: currentUser.name,
      timestamp: timestamp
    });
    saveOfflineQueue(queue);
  }

  function syncOfflineData() {
    if (isSyncing || !navigator.onLine) return;
    const queue = getOfflineQueue();
    if (queue.length === 0) return;

    isSyncing = true;
    const item = queue[0];

    window.onSyncItemResp = function(res) {
      const currentQ = getOfflineQueue();
      if (currentQ.length > 0) {
        currentQ.shift();
        saveOfflineQueue(currentQ);
      }
      isSyncing = false;

      if (getOfflineQueue().length > 0) {
        setTimeout(syncOfflineData, 200);
      }
    };

    callAPI({
      action: "checkIn",
      qrContent: item.qrContent,
      scannerId: item.scannerId,
      scannerName: item.scannerName,
      timestamp: item.timestamp
    }, "onSyncItemResp");

    setTimeout(() => {
      if (isSyncing) {
        isSyncing = false;
      }
    }, 5000);
  }

  function openQueueModal() {
    const q = getOfflineQueue();
    const listEl = document.getElementById("queueList");
    listEl.innerHTML = "";

    if (q.length === 0) {
      listEl.innerHTML = "<div style='text-align:center; color:#888;'>Hàng chờ trống! Tất cả dữ liệu đã được gửi.</div>";
    } else {
      q.forEach((item, idx) => {
        const code = parseStudentCode(item.qrContent);
        const timeStr = new Date(item.timestamp).toLocaleString('vi-VN');
        listEl.innerHTML += `
          <div class="queue-item">
            <div><b>Mã HS:</b> <span style="color:#64b5f6;">${code}</span></div>
            <div style="font-size:11px; color:#aaa; margin-top:2px;">⏱ Thời gian: ${timeStr}</div>
          </div>
        `;
      });
    }

    document.getElementById("queueModal").style.display = "flex";
  }

  function closeQueueModal() {
    document.getElementById("queueModal").style.display = "none";
  }

  function forceSyncQueue() {
    isSyncing = false;
    syncOfflineData();
    setTimeout(openQueueModal, 800);
  }

  function handleLogout() {
    localStorage.removeItem("user");
    currentUser = null;
    location.reload();
  }

  function playBeep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, ctx.currentTime);
      osc.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.12);
    } catch(e) {}
  }
</script>
</body>
</html>
