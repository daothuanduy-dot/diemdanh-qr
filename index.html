<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quét Mã QR Nề Nếp Học Sinh</title>

  <!-- THƯ VIỆN GIAO DIỆN & CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- HTML5 QR Code Scanner -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body class="bg-slate-100 p-3 md:p-6 min-h-screen">

  <main class="max-w-4xl mx-auto bg-white rounded-xl p-4 md:p-6 shadow-sm border border-gray-100 min-h-[460px]">
    
    <!-- SECTION: QUÉT MÃ QR NỀ NẾP -->
    <section id="content-tab-0" class="tab-content space-y-4">
      <h2 class="text-lg font-bold text-blue-700 uppercase flex items-center gap-2">
        <i class="fa-solid fa-qrcode"></i> Quét Mã QR Nề Nếp Học Sinh (Đồng Bộ CSDL)
      </h2>
      
      <!-- LỰA CHỌN HÌNH THỨC GHI NHẬN -->
      <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
        <label class="block font-bold text-gray-700 mb-2">Chọn hình thức ghi nhận khi quét QR:</label>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
          <label class="flex items-center gap-2 bg-white p-3 rounded-lg border cursor-pointer hover:border-blue-500">
            <input type="radio" name="qr-action" value="muon_co_phep" class="w-4 h-4 text-blue-600">
            <span class="text-sm font-semibold text-amber-600">Đi học muộn (Có phép)</span>
          </label>
          <label class="flex items-center gap-2 bg-white p-3 rounded-lg border cursor-pointer hover:border-blue-500">
            <input type="radio" name="qr-action" value="muon_khong_phep" checked class="w-4 h-4 text-blue-600">
            <span class="text-sm font-semibold text-red-600">Đi học muộn (Không phép)</span>
          </label>
          <label class="flex items-center gap-2 bg-white p-3 rounded-lg border cursor-pointer hover:border-blue-500">
            <input type="radio" name="qr-action" value="diem_thuong" class="w-4 h-4 text-blue-600">
            <span class="text-sm font-semibold text-green-600">Khen thưởng (+ Điểm)</span>
          </label>
          <label class="flex items-center gap-2 bg-white p-3 rounded-lg border cursor-pointer hover:border-blue-500">
            <input type="radio" name="qr-action" value="diem_tru" class="w-4 h-4 text-blue-600">
            <span class="text-sm font-semibold text-red-700">Vi phạm (- Điểm)</span>
          </label>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- CỘT 1: QUÉT CAMERA -->
        <div class="flex flex-col items-center space-y-3">
          <div id="reader" class="w-full max-w-sm bg-black rounded-xl overflow-hidden min-h-[260px] flex items-center justify-center text-white text-xs">
            <span id="camera-status-text" class="text-gray-400">Camera chưa bật</span>
          </div>
          <div class="flex gap-2">
            <button onclick="startQRScanner()" class="bg-blue-600 text-white text-sm px-4 py-2 rounded-lg font-semibold hover:bg-blue-700 flex items-center gap-1 shadow">
              <i class="fa-solid fa-camera"></i> Bật Camera Quét
            </button>
            <button onclick="stopQRScanner()" class="bg-gray-500 text-white text-sm px-4 py-2 rounded-lg font-semibold hover:bg-gray-600">
              Tắt Camera
            </button>
          </div>
        </div>

        <!-- CỘT 2: NHẬP TAY VÀ LỊCH SỬ QUÉT -->
        <div class="space-y-4">
          <!-- Ô NHẬP MÃ THỦ CÔNG -->
          <div class="bg-gray-50 p-3 rounded-xl border border-gray-200">
            <label class="block text-xs font-bold text-gray-600 mb-1">HOẶC NHẬP MÃ / CHUỖI QR TẠI ĐÂY (Thử thử với HS001, HS002...):</label>
            <div class="flex gap-2">
              <input type="text" id="manual-ma-hs" placeholder="Dán chuỗi QR hoặc nhập Mã HS..." class="flex-1 border p-2 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              <button onclick="processManualQR()" class="bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-bold hover:bg-emerald-700 shadow">
                Xác nhận
              </button>
            </div>
          </div>

          <!-- LỊCH SỬ QUÉT & TRẠNG THÁI -->
          <div class="space-y-2">
            <div class="flex justify-between items-center">
              <h3 class="font-bold text-sm text-gray-700">Lịch Sử Quét Trực Tiếp:</h3>
              <button onclick="triggerManualSync()" id="btn-sync-now" class="bg-amber-500 text-white text-xs px-3 py-1.5 rounded-lg font-bold hover:bg-amber-600 flex items-center gap-1 shadow-sm">
                <i class="fa-solid fa-rotate"></i> Số lượt quét (<span id="pending-count-badge">0</span>)
              </button>
            </div>

            <div id="qr-log-list" class="space-y-2 max-h-[260px] overflow-y-auto border p-2 rounded-xl bg-slate-50">
              <p class="text-sm text-gray-400 italic text-center p-3">Chưa có lượt quét nào trong phiên...</p>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- POPUP MODAL THÔNG BÁO / XÁC NHẬN KẾT QUẢ QUÉT QR -->
  <div id="qr-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex items-center justify-center hidden p-4 transition-all">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4 border border-gray-100 animate-fade-in">
      
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="text-lg font-bold text-blue-700 flex items-center gap-2">
          <i class="fa-solid fa-address-card"></i> Thông Tin Học Sinh Qua QR
        </h3>
        <button onclick="closeQRModal()" class="text-gray-400 hover:text-red-500 font-bold text-xl">&times;</button>
      </div>

      <!-- BẢNG THÔNG TIN TỪ CSDL -->
      <div class="space-y-3 bg-slate-50 p-4 rounded-xl border text-sm">
        <div class="flex justify-between items-center border-b pb-2">
          <span class="text-gray-500 font-semibold">Mã Học Sinh:</span>
          <strong id="modal-ma-hs" class="text-gray-800 font-mono">---</strong>
        </div>
        <div class="flex justify-between items-center border-b pb-2">
          <span class="text-gray-500 font-semibold">Họ và Tên:</span>
          <strong id="modal-ho-ten" class="text-blue-800 text-base">---</strong>
        </div>
        <div class="flex justify-between items-center border-b pb-2">
          <span class="text-gray-500 font-semibold">Lớp Học:</span>
          <span id="modal-lop" class="bg-blue-600 text-white font-bold px-3 py-1 rounded-md text-xs">---</span>
        </div>
        <div class="flex justify-between items-center border-b pb-2">
          <span class="text-gray-500 font-semibold">Hình Thức:</span>
          <span id="modal-hinh-thuc" class="font-bold text-red-600">---</span>
        </div>
        <div class="flex justify-between items-center">
          <span class="text-gray-500 font-semibold">Điểm Tính:</span>
          <strong id="modal-diem" class="font-bold text-lg text-red-600">---</strong>
        </div>
      </div>

      <!-- CÁC NÚT THAO TÁC -->
      <div class="flex gap-3 pt-2">
        <button onclick="confirmSaveQR()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-2.5 rounded-xl font-bold shadow-md flex items-center justify-center gap-1 transition-all">
          <i class="fa-solid fa-check"></i> XÁC NHẬN & LƯU
        </button>
        <button onclick="closeQRModal()" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-700 py-2.5 rounded-xl font-bold transition-all">
          <i class="fa-solid fa-xmark"></i> HỦY BỎ
        </button>
      </div>
    </div>
  </div>

  <!-- SCRIPT LOGIC XỬ LÝ -->
  <script>
    // 1. CẤU HÌNH CSDL SUPABASE (Hãy thay URL và API Key thực tế của dự án bạn vào 2 biến dưới đây)
    const SUPABASE_URL = "https://your-supabase-project-url.supabase.co";
    const SUPABASE_KEY = "your-supabase-anon-key";
    
    // DANH SÁCH MẪU NỘI BỘ (Chạy ngay lập tức khi chưa kết nối CSDL Supabase thực)
    const danhSachLocal = [
      { ma_hs: "HS001", ho_ten: "Nguyễn Văn An", lop: "10A1", khoi: "10" },
      { ma_hs: "HS002", ho_ten: "Trần Thị Bích", lop: "10A2", khoi: "10" },
      { ma_hs: "HS003", ho_ten: "Lê Văn Cường", lop: "11B1", khoi: "11" },
      { ma_hs: "HS004", ho_ten: "Phạm Minh Dung", lop: "12C3", khoi: "12" }
    ];

    let _supabase = null;
    if (typeof supabase !== 'undefined' && SUPABASE_URL.includes("supabase.co") && !SUPABASE_URL.includes("your-supabase-project-url")) {
      try {
        _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      } catch (e) {
        console.warn("Chưa thể khởi tạo kết nối Supabase:", e);
      }
    }

    let html5QrcodeScanner = null;
    let currentScannedStudent = null;
    let scanCount = 0;

    // 2. HÀM TRÍCH XUẤT TÊN LỚP TỰ ĐỘNG (Dù tên cột trong CSDL là ten_lop, lop, lop_hoc, class...)
    function extractLopName(data) {
      if (!data) return null;
      return data.ten_lop || data.lop || data.lop_hoc || data.class || data.tenLop || data.class_name || null;
    }

    function formatDateDDMMYYYY(dateObj) {
      const d = String(dateObj.getDate()).padStart(2, '0');
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const y = dateObj.getFullYear();
      return `${d}/${m}/${y}`;
    }

    function formatDateYYYYMMDD(dateObj) {
      const d = String(dateObj.getDate()).padStart(2, '0');
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const y = dateObj.getFullYear();
      return `${y}-${m}-${d}`;
    }

    // 3. XỬ LÝ TRUY VẤN DỮ LIỆU KHI QUÉT VÀ BẬT POPUP MODAL
    async function processQRCode(qrRawText) {
      if (!qrRawText) return;

      let maHS = qrRawText.trim();
      let hsData = null;

      // TH1: Chuỗi QR là dạng JSON cấu trúc
      try {
        const parsed = JSON.parse(qrRawText);
        if (parsed.ma_hs || parsed.id || parsed.maHS) {
          maHS = (parsed.ma_hs || parsed.id || parsed.maHS).toString().trim();
          
          // Kiểm tra xem chuỗi JSON có sẵn tên/lớp không
          const jsonLop = extractLopName(parsed);
          if (jsonLop || parsed.ho_ten || parsed.hoTen) {
            hsData = {
              ma_hs: maHS,
              ho_ten: parsed.ho_ten || parsed.hoTen || parsed.name || "Học sinh",
              lop: jsonLop || "Chưa phân lớp",
              khoi: parsed.khoi || "10"
            };
          }
        }
      } catch (e) {
        // Chuỗi thuần mã HS
      }

      // TH2: Truy vấn dữ liệu thực từ CSDL SUPABASE (Nếu đã cấu hình URL/Key)
      if (!hsData && _supabase) {
        try {
          console.log("Đang truy vấn Supabase với mã HS:", maHS);
          const { data, error } = await _supabase
            .from('hoc_sinh')
            .select('*')
            .or(`ma_hs.eq.${maHS},id.eq.${maHS}`)
            .maybeSingle();

          if (error) {
            console.error("Lỗi từ Supabase:", error);
          } else if (data) {
            console.log("Tìm thấy học sinh trên Supabase:", data);
            hsData = {
              ma_hs: data.ma_hs || data.id || maHS,
              ho_ten: data.ho_ten || data.hoTen || data.full_name || "Học sinh",
              lop: extractLopName(data) || "Chưa phân lớp",
              khoi: data.khoi || "10"
            };
          }
        } catch (err) {
          console.error("Kết nối máy chủ CSDL thất bại:", err);
        }
      }

      // TH3: Tra cứu trong danh sách Local Fallback
      if (!hsData) {
        const foundLocal = danhSachLocal.find(item => item.ma_hs.toUpperCase() === maHS.toUpperCase());
        if (foundLocal) {
          hsData = { ...foundLocal };
        }
      }

      // Dữ liệu mặc định cuối cùng nếu hoàn toàn không thấy mã ở đâu
      if (!hsData) {
        hsData = {
          ma_hs: maHS,
          ho_ten: `Học sinh (${maHS})`,
          lop: "Chưa phân lớp",
          khoi: "10"
        };
      }

      // Lấy hình thức vi phạm / khen thưởng đang chọn
      const actionEl = document.querySelector('input[name="qr-action"]:checked');
      const actionValue = actionEl ? actionEl.value : 'muon_khong_phep';
      
      let actionLabel = "Đi học muộn (Không phép)";
      let diemCalc = -3;

      if (actionValue === 'muon_co_phep') { actionLabel = "Đi học muộn (Có phép)"; diemCalc = -2; }
      else if (actionValue === 'diem_thuong') { actionLabel = "Khen thưởng (+ Điểm)"; diemCalc = 2; }
      else if (actionValue === 'diem_tru') { actionLabel = "Vi phạm (- Điểm)"; diemCalc = -2; }

      // Lưu đối tượng học sinh hiện tại đang chờ xác nhận
      currentScannedStudent = {
        ma_hs: hsData.ma_hs || maHS,
        ho_ten: hsData.ho_ten,
        lop: hsData.lop,
        khoi: hsData.khoi,
        actionValue: actionValue,
        actionLabel: actionLabel,
        diem: diemCalc,
        time: new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
        dateDDMMYYYY: formatDateDDMMYYYY(new Date()),
        dateYYYYMMDD: formatDateYYYYMMDD(new Date())
      };

      // ĐỔ DỮ LIỆU LÊN POPUP MODAL
      document.getElementById('modal-ma-hs').innerText = currentScannedStudent.ma_hs;
      document.getElementById('modal-ho-ten').innerText = currentScannedStudent.ho_ten;
      document.getElementById('modal-lop').innerText = currentScannedStudent.lop; // <--- TRẢ VỀ THÔNG TIN LỚP
      document.getElementById('modal-hinh-thuc').innerText = currentScannedStudent.actionLabel;
      
      const diemText = currentScannedStudent.diem > 0 ? `+${currentScannedStudent.diem} điểm` : `${currentScannedStudent.diem} điểm`;
      document.getElementById('modal-diem').innerText = diemText;
      
      if (currentScannedStudent.diem > 0) {
        document.getElementById('modal-diem').className = "font-bold text-lg text-emerald-600";
      } else {
        document.getElementById('modal-diem').className = "font-bold text-lg text-red-600";
      }

      // KÍCH HOẠT HIỂN THỊ POPUP MODAL
      document.getElementById('qr-modal').classList.remove('hidden');
    }

    // 4. LƯU BẢN GHI KHI NGƯỜI DÙNG BẤM "XÁC NHẬN & LƯU" TRÊN POPUP
    async function confirmSaveQR() {
      if (!currentScannedStudent) return;

      const st = currentScannedStudent;

      // Lưu vào CSDL Supabase (Bảng diem_danh_master) nếu có kết nối
      if (_supabase) {
        try {
          await _supabase.from('diem_danh_master').insert([{
            ma_hs: st.ma_hs,
            ho_ten: st.ho_ten,
            khoi: st.khoi,
            lop: st.lop,
            ngay_diem_danh: st.dateYYYYMMDD,
            ngay_hien_thi: st.dateDDMMYYYY,
            trang_thai: st.actionValue,
            chi_tiet: st.actionLabel,
            diem: st.diem,
            ten_nguoi_cap_nhat: 'Bảo vệ / Cờ đỏ'
          }]);
        } catch (e) {
          console.warn("Chưa ghi được vào Supabase DB thực tế, lưu giao diện cục bộ.");
        }
      }

      // THÊM VÀO DANH SÁCH LỊCH SỬ DƯỚI GIAO DIỆN (HIỂN THỊ RÕ LỚP)
      addLogToUI(st);

      // ĐÓNG POPUP MODAL
      closeQRModal();
    }

    // 5. THÊM DÒNG LỊCH SỬ QUÉT VÀO GIAO DIỆN
    function addLogToUI(st) {
      const logContainer = document.getElementById('qr-log-list');

      // Xóa dòng thông báo trống
      if (logContainer.querySelector('p.italic')) {
        logContainer.innerHTML = '';
      }

      const logHTML = `
        <div class="bg-white p-3 rounded-xl border border-gray-200 flex justify-between items-center text-xs shadow-sm hover:border-blue-300 transition-all">
          <div class="space-y-0.5">
            <div class="font-bold text-gray-800 text-sm flex items-center gap-1.5">
              <span>${st.ho_ten}</span>
              <span class="bg-blue-100 text-blue-700 px-2 py-0.5 rounded-md font-bold text-xs">Lớp: ${st.lop}</span>
            </div>
            <div class="text-gray-500">
              Mã HS: <strong class="text-gray-700 font-mono">${st.ma_hs}</strong> • 
              <span class="${st.diem < 0 ? 'text-red-600 font-semibold' : 'text-emerald-600 font-semibold'}">${st.actionLabel} (${st.diem > 0 ? '+' : ''}${st.diem}đ)</span>
            </div>
          </div>
          <div class="text-right shrink-0">
            <span class="text-gray-400 font-mono block text-[11px]">${st.time}</span>
            <span class="inline-flex items-center gap-1 text-[10px] text-emerald-600 font-bold bg-emerald-50 px-1.5 py-0.5 rounded border border-emerald-200">
              <i class="fa-solid fa-circle-check"></i> Đã ghi nhận
            </span>
          </div>
        </div>
      `;

      logContainer.insertAdjacentHTML('afterbegin', logHTML);

      scanCount++;
      document.getElementById('pending-count-badge').innerText = scanCount;
    }

    // 6. ĐÓNG POPUP MODAL VÀ TIẾP TỤC QUÉT CAMERA
    function closeQRModal() {
      document.getElementById('qr-modal').classList.add('hidden');
      currentScannedStudent = null;

      // Resume camera nếu scanner đang khởi động
      if (html5QrcodeScanner) {
        try { html5QrcodeScanner.resume(); } catch (e) {}
      }
    }

    // 7. XỬ LÝ NHẬP TAY MÃ HS
    function processManualQR() {
      const input = document.getElementById('manual-ma-hs');
      const val = input.value.trim();
      if (!val) {
        alert("Vui lòng nhập Mã Học Sinh hoặc Dán nội dung QR!");
        return;
      }
      processQRCode(val);
      input.value = '';
    }

    // 8. BẬT CAMERA QUÉT TỨC THỜI
    function startQRScanner() {
      if (html5QrcodeScanner) {
        stopQRScanner();
      }

      html5QrcodeScanner = new Html5Qrcode("reader");
      document.getElementById('camera-status-text').innerText = "Đang khởi động Camera...";

      html5QrcodeScanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 220, height: 220 } },
        (decodedText) => {
          // Tạm dừng scanner để mở modal
          try { html5QrcodeScanner.pause(); } catch(e) {}
          processQRCode(decodedText);
        },
        () => {}
      ).catch(err => {
        alert("Không thể mở Camera. Vui lòng kiểm tra quyền truy cập Camera trên trình duyệt!");
        document.getElementById('camera-status-text').innerText = "Lỗi kết nối Camera";
      });
    }

    // 9. TẮT CAMERA
    function stopQRScanner() {
      if (html5QrcodeScanner) {
        html5QrcodeScanner.stop().then(() => {
          document.getElementById('reader').innerHTML = '<span id="camera-status-text" class="text-gray-400">Camera đã tắt</span>';
          html5QrcodeScanner = null;
        }).catch(() => {});
      }
    }

    function triggerManualSync() {
      alert(`Đã làm mới dữ liệu thành công (${scanCount} lượt quét trong phiên)!`);
    }
  </script>
</body>
</html>
