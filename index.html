<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ Thống Quét Mã QR & Điểm Danh</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #fff; margin: 0; padding: 15px; }
    .container { max-width: 480px; margin: 0 auto; text-align: center; }
    .card { background: #1e1e1e; padding: 25px; border-radius: 12px; border: 1px solid #333; margin-top: 15px; }
    input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; border: 1px solid #444; background: #222; color: #fff; }
    button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; background: #1a73e8; color: white; }
    button.alt { background: #333; border: 1px solid #555; }
    #reader { width: 100%; background: #000; border-radius: 12px; overflow: hidden; margin-top: 15px; }
    
    /* Overlay Popup 2s */
    #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 9999; justify-content: center; align-items: center; }
    .popup-card { background: #fff; color: #333; padding: 25px; border-radius: 16px; width: 85%; max-width: 380px; text-align: center; }
    .popup-card.success { border-top: 8px solid #4caf50; }
    .popup-card.duplicate { border-top: 8px solid #ff9800; }
    .popup-card.error { border-top: 8px solid #f44336; }
    .timer-bar { height: 4px; background: #1a73e8; width: 100%; margin-top: 15px; animation: shrink 2s linear forwards; }
    @keyframes shrink { from { width: 100%; } to { width: 0%; } }
  </style>
</head>
<body>

<div class="container">
  <!-- MÀN HÌNH ĐĂNG NHẬP -->
  <div id="loginView" class="card">
    <h2 style="color: #4caf50;">ĐĂNG NHẬP HỆ THỐNG</h2>
    <input type="text" id="username" placeholder="Số định danh / Mã cán bộ / Mã học sinh">
    <input type="password" id="password" placeholder="Mật khẩu">
    <button onclick="handleLogin()">ĐĂNG NHẬP</button>
    <div id="loginError" style="color: #f44336; margin-top: 10px; font-size: 14px;"></div>
  </div>

  <!-- MÀN HÌNH CHÍNH (QUÉT QR) -->
  <div id="mainView" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <span id="userInfo" style="font-weight: bold; color: #64b5f6;"></span>
      <div>
        <button onclick="showChangePassModal()" class="alt" style="width: auto; padding: 6px 10px; font-size: 12px;">Đổi mật khẩu</button>
        <button onclick="handleLogout()" class="alt" style="width: auto; padding: 6px 10px; font-size: 12px; background: #c62828;">Đăng xuất</button>
      </div>
    </div>
    <div id="reader"></div>
  </div>

  <!-- MÀN HÌNH ĐỔI MẬT KHẨU -->
  <div id="changePassView" class="card" style="display: none;">
    <h3>ĐỔI MẬT KHẨU</h3>
    <input type="password" id="oldPass" placeholder="Mật khẩu hiện tại">
    <input type="password" id="newPass" placeholder="Mật khẩu mới">
    <button onclick="handleChangePassword()">XÁC NHẬN ĐỔI MẬT KHẨU</button>
    <button onclick="cancelChangePass()" class="alt">HỦY BỎ</button>
    <div id="changePassMsg" style="margin-top: 10px; font-size: 14px;"></div>
  </div>
</div>

<!-- POPUP HIỂN THỊ KẾT QUẢ QUÉT 2S -->
<div id="overlay">
  <div id="popupCard" class="popup-card">
    <div id="statusIcon" style="font-size: 40px;">✅</div>
    <div id="statusTitle" style="font-weight: bold; font-size: 12px; color: #666; text-transform: uppercase;"></div>
    <div id="studentName" style="font-size: 20px; font-weight: bold; color: #1a73e8; margin: 5px 0;"></div>
    <div id="studentClass" style="font-weight: bold; color: #d93025;"></div>
    <div id="studentId" style="color: #555;"></div>
    <div id="checkTime" style="font-size: 12px; color: #777; margin-top: 5px;"></div>
    <div id="scannerInfo" style="font-size: 12px; color: #388e3c; margin-top: 3px;"></div>
    <div class="timer-bar"></div>
  </div>
</div>

<script>
  // 🔴 THAY ĐƯỜNG DẪN GOOGLE APPS SCRIPT CỦA BẠN VÀO GIỮA DẤU NGOẶC KÉP DƯỚI ĐÂY:
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxysEhObllT7mAAwtF-_t9IVVEQvxbJDrq4sQgyY-H7-txzYbt6iDRMXaLJUkhuVmT3/exec";

  let currentUser = null;
  let html5QrcodeScanner = null;
  let isProcessing = false;

  window.onload = function() {
    const savedUser = localStorage.getItem("user");
    if (savedUser) {
      currentUser = JSON.parse(savedUser);
      showMainView();
    }
  };

  function handleLogin() {
    const u = document.getElementById("username").value.trim();
    const p = document.getElementById("password").value.trim();
    if (!u || !p) return alert("Vui lòng nhập đầy đủ Số định danh và Mật khẩu!");

    document.getElementById("loginError").innerText = "Đang xác thực...";
    fetch(`${SCRIPT_URL}?action=login&username=${encodeURIComponent(u)}&password=${encodeURIComponent(p)}`)
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          currentUser = data.user;
          localStorage.setItem("user", JSON.stringify(currentUser));
          document.getElementById("loginError").innerText = "";
          showMainView();
        } else {
          document.getElementById("loginError").innerText = data.message;
        }
      })
      .catch(err => document.getElementById("loginError").innerText = "Lỗi kết nối máy chủ!");
  }

  function showMainView() {
    document.getElementById("loginView").style.display = "none";
    document.getElementById("changePassView").style.display = "none";
    document.getElementById("mainView").style.display = "block";
    document.getElementById("userInfo").innerText = `${currentUser.name} (${currentUser.role})`;

    if (!html5QrcodeScanner) {
      html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: { width: 240, height: 240 } });
      html5QrcodeScanner.render(onScanSuccess);
    }
  }

  function onScanSuccess(decodedText) {
    if (isProcessing) return;
    isProcessing = true;
    playBeep();

    fetch(`${SCRIPT_URL}?action=checkIn&qrContent=${encodeURIComponent(decodedText)}&scannerId=${encodeURIComponent(currentUser.id)}`)
      .then(res => res.json())
      .then(res => handleResult(res))
      .catch(err => handleResult({ success: false, message: "Lỗi ghi dữ liệu!" }));
  }

  function handleResult(res) {
    const overlay = document.getElementById('overlay');
    const card = document.getElementById('popupCard');

    if (res.success) {
      document.getElementById('studentName').innerText = res.student.name;
      document.getElementById('studentClass').innerText = "Lớp: " + res.student.className;
      document.getElementById('studentId').innerText = "Mã HS: " + res.student.id;
      document.getElementById('scannerInfo').innerText = "Người quét: " + res.scanner;

      if (res.alreadyCheckedIn) {
        card.className = "popup-card duplicate";
        document.getElementById('statusIcon').innerText = "⚠️";
        document.getElementById('statusTitle').innerText = "ĐÃ ĐIỂM DANH TRƯỚC ĐÓ";
        document.getElementById('checkTime').innerText = res.message;
      } else {
        card.className = "popup-card success";
        document.getElementById('statusIcon').innerText = "✅";
        document.getElementById('statusTitle').innerText = "ĐIỂM DANH THÀNH CÔNG";
        document.getElementById('checkTime').innerText = "Thời gian: " + res.time;
      }
    } else {
      card.className = "popup-card error";
      document.getElementById('statusIcon').innerText = "❌";
      document.getElementById('statusTitle').innerText = "LỖI ĐIỂM DANH";
      document.getElementById('studentName').innerText = res.message;
      document.getElementById('studentClass').innerText = "";
      document.getElementById('studentId').innerText = "";
      document.getElementById('checkTime').innerText = "";
      document.getElementById('scannerInfo').innerText = "";
    }

    overlay.style.display = 'flex';
    setTimeout(() => {
      overlay.style.display = 'none';
      isProcessing = false;
    }, 2000);
  }

  function showChangePassModal() {
    document.getElementById("mainView").style.display = "none";
    document.getElementById("changePassView").style.display = "block";
  }

  function cancelChangePass() {
    showMainView();
  }

  function handleChangePassword() {
    const oldP = document.getElementById("oldPass").value.trim();
    const newP = document.getElementById("newPass").value.trim();
    if (!oldP || !newP) return alert("Vui lòng điền đầy đủ mật khẩu cũ và mới!");

    document.getElementById("changePassMsg").style.color = "#ffeb3b";
    document.getElementById("changePassMsg").innerText = "Đang cập nhật...";

    fetch(`${SCRIPT_URL}?action=changePassword&username=${encodeURIComponent(currentUser.id)}&oldPassword=${encodeURIComponent(oldP)}&newPassword=${encodeURIComponent(newP)}`)
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          document.getElementById("changePassMsg").style.color = "#4caf50";
          document.getElementById("changePassMsg").innerText = data.message;
          setTimeout(() => {
            document.getElementById("oldPass").value = "";
            document.getElementById("newPass").value = "";
            showMainView();
          }, 1500);
        } else {
          document.getElementById("changePassMsg").style.color = "#f44336";
          document.getElementById("changePassMsg").innerText = data.message;
        }
      });
  }

  function handleLogout() {
    localStorage.removeItem("user");
    currentUser = null;
    location.reload();
  }

  function playBeep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, ctx.currentTime);
      osc.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.12);
    } catch(e) {}
  }
</script>
</body>
</html>
